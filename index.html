<!DOCTYPE html>
<!--
  FrugalFin — the installable launcher.

  WHY THIS FILE EXISTS. An Apps Script web app is served inside a nested iframe: at
  `/exec` the TOP-LEVEL document belongs to Google and Index.html runs in a child
  frame. Browsers read home-screen and install metadata from the top-level document
  only, so no icon link, manifest link or apple-* meta tag placed in Index.html can
  ever be seen by the installer. This page is a top-level document the owner controls,
  which is the only place that metadata can live. Install from THIS url.

  ============================================================================
  IT REDIRECTS. IT USED TO FRAME THE APP, AND FRAMING DOES NOT WORK.
  ============================================================================
  The earlier version of this file embedded `/exec` in an <iframe>. That returned a
  Google 401 for the second household member in BOTH Safari and Chrome, while the raw
  `/exec` url opened fine for her in BOTH — which is the measurement that settles it:
  the failure is not the device, not the browser, and not the deployment's access
  setting, which is "Anyone with a Google account".

  The deployment runs as "User accessing the web app", so Google must identify the
  caller on every request. A cross-origin frame does not carry that session: browsers
  partition or block third-party cookies by default, and Google will not render its
  own sign-in or consent screens inside a frame at all, so there is no way for the
  request to become authenticated from in here. Google answers 401 and the frame is
  blank. There is nothing to configure — an authenticated Apps Script web app cannot be
  framed by a third-party origin.

  WHAT THIS COSTS, STATED PLAINLY. Navigating to another origin leaves the installed
  app's scope. On iOS the app opens in Safari with its browser bars visible instead of
  standalone; on Android Chrome it stays in the app window but gains a small url bar.
  The home-screen icon and the app name — the thing this wrapper exists for — still
  work. Full standalone chrome and a working app for two people are mutually exclusive
  here, and a blank 401 is not a tradeoff worth keeping.

  THE ALTERNATIVE WAS REJECTED. Framing works if the deployment is set to run as the
  owner with access "Anyone", because then no login is needed. But Api.resolveCaller_()
  identifies people through Session.getActiveUser().getEmail() and checks them against
  the Requirement 9 allowlist; with anonymous access that email is empty, every caller
  is denied, and opening the access up to anyone with the link would put the
  household's finances behind no check at all. Not a trade to make for browser chrome.

  THE URL BELOW IS A COPY. Publishing a new VERSION of the deployment keeps it;
  creating a new DEPLOYMENT does not. Re-upload this file whenever a new deployment is
  created — it is the one file the paste checklist does not cover.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- PINCH-ZOOM IS NOT DISABLED. An earlier version carried `maximum-scale=1.0,
       user-scalable=no`; blocking zoom fails WCAG 1.4.4, and on a page of financial
       figures that is a real loss rather than a theoretical one. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>FrugalFin Finance</title>
  <meta name="theme-color" content="#4f46e5">

  <!-- REDIRECT, THREE WAYS, IN DESCENDING ORDER OF SPEED. `location.replace` leaves no
       history entry, so the phone's back gesture does not land the user back on this
       page in a loop. The meta refresh covers scripting being off. The link covers
       both failing, because a launcher that silently does nothing is worse than one
       that asks for a tap. -->
  <script>
    window.location.replace('https://script.google.com/macros/s/AKfycbw9J4ySaWmWVxvleoTByXWciRgCG0YbcFVtTgb91eDYQWBnrvMqgtNH8f9eoo69G9U9/exec');
  </script>
  <noscript>
    <meta http-equiv="refresh"
          content="0; url=https://script.google.com/macros/s/AKfycbw9J4ySaWmWVxvleoTByXWciRgCG0YbcFVtTgb91eDYQWBnrvMqgtNH8f9eoo69G9U9/exec">
  </noscript>

  <!-- CHROME AND ANDROID: the manifest is the only source of the installed icon.
       Relative, so it works from any repository path or a custom domain. -->
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- IOS SAFARI: reads this and not the manifest. Opaque — iOS composites a
       transparent PNG onto black. -->
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FrugalFin">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Browser tab favicon. The tab icon, the iOS home-screen icon and the installed
       app icon are three separate lookups.

       `sizes="any"` MAKES NO CLAIM TO BE WRONG ABOUT. Chrome rejects an icon whose
       declared size does not match its real pixels, and it reported exactly that twice
       while these files were being re-exported. The manifest declares 512x512 because
       Chrome itself confirmed that is what the file now is. -->
  <link rel="icon" type="image/png" sizes="any" href="./icon-512.png">

  <style>
    /* This page is visible for a moment at most, and for longer only if both
       redirects failed. It has to be legible in that case rather than a white flash
       with a stranded link in the corner. */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background-color: #f3f4f6;
      color: #374151;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
    p  { font-size: 0.875rem; color: #6b7280; margin: 0 0 1.5rem; }
    a.launch {
      display: inline-block;
      background: #4f46e5;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      padding: 0.875rem 1.5rem;
      border-radius: 0.5rem;
      /* 44px minimum target, the same floor the app's own navigation uses. */
      min-height: 44px;
      min-width: 44px;
    }
  </style>
</head>
<body>
  <h1>FrugalFin</h1>
  <p>Opening&hellip;</p>
  <a class="launch"
     href="https://script.google.com/macros/s/AKfycbw9J4ySaWmWVxvleoTByXWciRgCG0YbcFVtTgb91eDYQWBnrvMqgtNH8f9eoo69G9U9/exec">
    Open FrugalFin
  </a>
</body>
</html>
